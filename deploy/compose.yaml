services:
  backend:
    build: ../backend
    restart: unless-stopped
    environment:
      OWNER_USERNAME: ${OWNER_USERNAME:-owner}
      OWNER_PASSWORD: ${OWNER_PASSWORD:?Set a private owner password}
      PUBLIC_ORIGIN: https://${DOMAIN:?Set the private deployment domain}
      SQLITE_DATABASE_PATH: /data/open-tennis.db
      WIKI_INDEX_PATH: /data/wiki_index
      TUTORIAL_PATH: /app/data/tutorial
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-gemini-embedding-2}
      AGENT_ENABLED: ${AGENT_ENABLED:-false}
      ALLOW_PERSONAL_MODEL_CONTEXT: ${ALLOW_PERSONAL_MODEL_CONTEXT:-false}
      SEMANTIC_INDEX_ENABLED: ${SEMANTIC_INDEX_ENABLED:-false}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-1}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-4096}
    volumes:
      - tennis_data:/data
    networks:
      - private

  frontend:
    build: ../frontend
    restart: unless-stopped
    environment:
      OWNER_USERNAME: ${OWNER_USERNAME:-owner}
      OWNER_PASSWORD: ${OWNER_PASSWORD:?Set a private owner password}
      BACKEND_ORIGIN: http://backend:8000
      PUBLIC_ORIGIN: https://${DOMAIN:?Set the private deployment domain}
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      - backend
    networks:
      - private

  https:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set the private deployment domain}
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
    networks:
      - private

networks:
  private:

volumes:
  tennis_data:
  caddy_data:
  caddy_config:
